<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default" data-assets-path="../assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Records - Clinic CMS</title>
    
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="../assets/vendor/css/core.css" />
    <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" />
    <link rel="stylesheet" href="../assets/css/demo.css" />
    <link rel="stylesheet" href="../assets/css/layout-fixes.css" />
</head>

<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <!-- Sidebar -->
            <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
                <!-- Loaded via JS -->
            </aside>

            <div class="layout-page">
                <!-- Navbar -->
                <nav id="layout-navbar" class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme">
                    <!-- Loaded via JS -->
                </nav>

                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <h4 class="fw-bold py-3 mb-4">
                            <span class="text-muted fw-light">Doctor /</span> Medical Records
                        </h4>

                        <!-- Patient Info Card -->
                        <div class="card mb-4" id="patientInfoCard" style="display: none;">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <h5 id="patientName">--</h5>
                                        <p class="text-muted mb-0">
                                            Patient ID: <span id="patientId">--</span> | 
                                            Age: <span id="patientAge">--</span> | 
                                            Gender: <span id="patientGender">--</span>
                                        </p>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <button type="button" class="btn btn-primary" onclick="showCreateRecordModal()">
                                            <i class="bx bx-plus me-2"></i>Add Medical Record
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Medical Records List -->
                        <div class="card">
                            <div class="card-header">
                                <div class="row align-items-center">
                                    <div class="col-md-6">
                                        <h5 class="mb-0">Medical History</h5>
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" class="form-control form-control-sm" id="searchRecords" placeholder="Search records..." />
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <span class="badge bg-primary" id="recordCount">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="recordsContainer">
                                    <div class="text-center py-5 text-muted">
                                        <i class="bx bx-folder-open" style="font-size: 48px;"></i>
                                        <p class="mt-3">Select a patient to view medical records</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <footer class="content-footer footer bg-footer-theme">
                        <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                            <div class="mb-2 mb-md-0">
                                © <script>document.write(new Date().getFullYear())</script> Clinic CMS
                            </div>
                        </div>
                    </footer>
                </div>
            </div>
        </div>

        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <!-- Create/Edit Medical Record Modal -->
    <div class="modal fade" id="medicalRecordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Medical Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="medicalRecordForm">
                    <div class="modal-body">
                        <input type="hidden" id="recordId" />
                        
                        <div class="mb-3">
                            <label class="form-label">Chief Complaint *</label>
                            <input type="text" class="form-control" id="chiefComplaint" required />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Diagnosis *</label>
                            <textarea class="form-control" id="diagnosis" rows="3" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Treatment Plan</label>
                            <textarea class="form-control" id="treatmentPlan" rows="3"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Blood Pressure</label>
                                <input type="text" class="form-control" id="bloodPressure" placeholder="120/80" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Heart Rate</label>
                                <input type="text" class="form-control" id="heartRate" placeholder="72 bpm" />
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Temperature</label>
                                <input type="text" class="form-control" id="temperature" placeholder="36.5°C" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Weight</label>
                                <input type="text" class="form-control" id="weight" placeholder="70 kg" />
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Additional Notes</label>
                            <textarea class="form-control" id="notes" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Attachment (Lab Results, Images, etc.)</label>
                            <input type="file" class="form-control" id="attachment" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" />
                            <small class="text-muted">Max file size: 5MB. Allowed: PDF, JPG, PNG, DOC, DOCX</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bx bx-save me-2"></i>Save Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Core JS -->
    <script src="../assets/vendor/libs/jquery/jquery.js"></script>
    <script src="../assets/vendor/libs/popper/popper.js"></script>
    <script src="../assets/vendor/js/bootstrap.js"></script>
    <script src="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    
    <!-- Helpers MUST load before main.js -->
    <script src="../assets/vendor/js/helpers.js"></script>
    
    <!-- Layout Loader (loads sidebar/navbar FIRST) -->
    <script src="../assets/js/layout-loader.js"></script>
    
    <!-- Menu.js and Main.js (will initialize after layout is loaded) -->
    <script src="../assets/vendor/js/menu.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <!-- Page JS -->
    <script src="../assets/js/doctor-medical-records.js"></script>
</body>
</html>
